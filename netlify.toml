[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://shop.onetriponebite.com/"
  to = "/shop.html"
  status = 302
  force = true

[[redirects]]
  from = "https://shop.onetriponebite.com/index.html"
  to = "/shop.html"
  status = 302
  force = true
