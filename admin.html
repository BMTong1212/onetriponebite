<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Resend Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#06142f;
  --navy2:#08204a;
  --blue:#155ed0;
  --gold:#ffb72b;
  --text:#10203f;
  --muted:#5b6b86;
  --gray2:#dbe5f2;
  --soft:#f5f8fc;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --red:#dc2626;
  --red-bg:#fee2e2;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--soft);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

/* 403 screen */
.screen-403{
  text-align:center;
  max-width:400px;
}
.screen-403 .code{
  font-size:72px;
  font-weight:700;
  color:var(--red);
  line-height:1;
}
.screen-403 .msg{
  font-size:18px;
  color:var(--text);
  margin-top:12px;
  font-weight:500;
}
.screen-403 .sub{
  font-size:14px;
  color:var(--muted);
  margin-top:8px;
}

/* Admin card */
.card{
  background:#fff;
  border-radius:16px;
  padding:40px;
  width:100%;
  max-width:480px;
  box-shadow:0 4px 24px rgba(6,20,47,0.10);
}
.card-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:28px;
  padding-bottom:20px;
  border-bottom:1px solid var(--gray2);
}
.card-header .icon{
  width:40px;
  height:40px;
  background:var(--navy);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.card-header h1{
  font-size:18px;
  font-weight:700;
  color:var(--navy);
}
.card-header p{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--text);
  margin-bottom:8px;
  letter-spacing:0.01em;
}
.input-row{
  display:flex;
  gap:10px;
}
input[type="text"]{
  flex:1;
  padding:12px 14px;
  border:1.5px solid var(--gray2);
  border-radius:10px;
  font-family:'Inter',sans-serif;
  font-size:15px;
  color:var(--text);
  outline:none;
  transition:border-color 0.15s;
  letter-spacing:0.03em;
}
input[type="text"]::placeholder{color:var(--muted)}
input[type="text"]:focus{border-color:var(--blue)}

button{
  padding:12px 20px;
  background:var(--navy);
  color:var(--gold);
  border:none;
  border-radius:10px;
  font-family:'Inter',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:opacity 0.15s;
  display:flex;
  align-items:center;
  gap:6px;
}
button:hover:not(:disabled){opacity:0.85}
button:disabled{opacity:0.5;cursor:not-allowed}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,183,43,0.3);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

.result{
  margin-top:16px;
  padding:14px 16px;
  border-radius:10px;
  font-size:14px;
  font-weight:500;
  display:none;
  align-items:flex-start;
  gap:10px;
}
.result.success{
  background:var(--green-bg);
  color:var(--green);
  display:flex;
}
.result.error{
  background:var(--red-bg);
  color:var(--red);
  display:flex;
}
.result-icon{font-size:18px;line-height:1.2;flex-shrink:0}
.result-text{line-height:1.5}
.result-email{font-weight:700}

.hint{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const ADMIN_KEY = 'khaidaica';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwaNGURto97SUbYk6tXUCndsiuglGsjIU1mKFF6Iz3sn_xUkBluwrUMCpUyg_NRPnNm/exec';

const params = new URLSearchParams(location.search);

if (params.get('key') !== ADMIN_KEY) {
  document.getElementById('root').innerHTML = `
    <div class="screen-403">
      <div class="code">403</div>
      <div class="msg">Truy cập bị từ chối</div>
      <div class="sub">Thêm ?key=... vào URL để tiếp tục</div>
    </div>`;
} else {
  document.getElementById('root').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="icon">🔧</div>
        <div>
          <h1>Admin — Resend Email</h1>
          <p>Gửi lại email delivery cho khách hàng</p>
        </div>
      </div>

      <label for="ref-input">Mã ref đơn hàng</label>
      <div class="input-row">
        <input type="text" id="ref-input" placeholder="CC30-XXXXXX" autocomplete="off" spellcheck="false">
        <button id="send-btn" onclick="resend()">
          <span class="spinner" id="spinner"></span>
          <span id="btn-label">Gửi</span>
        </button>
      </div>
      <div class="hint">Ref code tìm trong Google Sheet, cột B (ví dụ: CC30-A1B2C3)</div>

      <div class="result" id="result">
        <span class="result-icon" id="result-icon"></span>
        <span class="result-text" id="result-text"></span>
      </div>
    </div>`;

  document.getElementById('ref-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') resend();
  });
}

async function resend() {
  const input = document.getElementById('ref-input');
  const ref = input.value.trim().toUpperCase();

  if (!ref) {
    input.focus();
    return;
  }

  const btn = document.getElementById('send-btn');
  const spinner = document.getElementById('spinner');
  const btnLabel = document.getElementById('btn-label');
  const result = document.getElementById('result');

  btn.disabled = true;
  spinner.style.display = 'block';
  btnLabel.textContent = 'Đang gửi...';
  result.className = 'result';
  result.style.display = 'none';

  try {
    const url = `${GAS_URL}?action=resend&ref=${encodeURIComponent(ref)}`;
    const res = await fetch(url);
    const data = await res.json();

    const icon = document.getElementById('result-icon');
    const text = document.getElementById('result-text');

    if (data.success) {
      icon.textContent = '✓';
      text.innerHTML = `Đã gửi email đến <span class="result-email">${data.email}</span><br>Ref: ${data.ref} · Trạng thái: ${data.status}`;
      result.className = 'result success';
    } else {
      icon.textContent = '✕';
      text.textContent = data.error || 'Có lỗi xảy ra';
      result.className = 'result error';
    }
    result.style.display = 'flex';
  } catch (err) {
    const icon = document.getElementById('result-icon');
    const text = document.getElementById('result-text');
    icon.textContent = '✕';
    text.textContent = 'Không kết nối được GAS. Kiểm tra mạng hoặc deployment URL.';
    result.className = 'result error';
    result.style.display = 'flex';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnLabel.textContent = 'Gửi';
  }
}
</script>
</body>
</html>
